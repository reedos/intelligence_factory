# Production hosting on Cloudflare: build, test, then deploy the site as a Worker with static assets on the route
# reedos.dev/<mount>/*. The rest of reedos.dev stays on GitHub Pages, and pages.yml keeps deploying there as a
# fallback (delete the route and GitHub serves the site again). Manual on purpose, like pages.yml:
#   gh workflow run cloudflare.yml --ref main                      (mount intelligence_factory)
#   gh workflow run cloudflare.yml --ref <branch> -f mount=if-cf-test   (a throwaway test path)
name: cloudflare
on:
  workflow_dispatch:
    inputs:
      mount: { description: 'Path under reedos.dev to serve the site at', default: 'intelligence_factory', required: true }
      html_handling: { description: 'Workers assets html_handling', default: 'auto-trailing-slash', required: true }
permissions: { contents: read }
concurrency: { group: 'cloudflare-${{ inputs.mount }}', cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build
      - name: Stage the build under its mount path
        run: node tools/cloudflare-stage.mjs "${{ inputs.mount }}" "${{ inputs.html_handling }}"
      - name: Deploy the Worker and its route
        run: npx wrangler@4 deploy --config cf-stage/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
