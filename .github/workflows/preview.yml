# Branch previews on Cloudflare Pages: every push to a branch other than main builds the site and uploads it to
# https://<branch>.intelligence-factory-dly.pages.dev (slashes in the branch name become dashes; the
# project is "intelligence-factory", its pages.dev subdomain got a suffix). Cloudflare marks preview
# deployments noindex. Production stays on GitHub Pages (pages.yml); nothing here touches reedos.dev.
# Dependabot branches are skipped: the upload step failed on every Dependabot run (10/07 to 10/14), and Dependabot
# runs read a separate secret store from the repo's Actions secrets. checks.yml still tests and builds them.
name: preview
on:
  push: { branches-ignore: [main] }
  workflow_dispatch:
permissions: { contents: read, deployments: write }
concurrency: { group: 'preview-${{ github.ref_name }}', cancel-in-progress: true }
jobs:
  preview:
    if: ${{ !startsWith(github.ref_name, 'dependabot/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run build
      - name: Upload the preview
        run: npx wrangler@4 pages deploy dist --project-name=intelligence-factory --branch="${{ github.ref_name }}" --commit-hash="${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
